<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Аварийная</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121110">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f5ae39'/%3E%3Ctext x='16' y='23' font-family='Helvetica,Arial,sans-serif' font-size='21' font-weight='700' text-anchor='middle' fill='%23121110'%3E%D0%90%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:'Fira Sans';font-style:normal;font-weight:400;font-display:swap;
  src:url(fonts/fira-sans-400-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Fira Sans';font-style:normal;font-weight:400;font-display:swap;
  src:url(fonts/fira-sans-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Fira Sans Condensed';font-style:normal;font-weight:700;font-display:swap;
  src:url(fonts/fira-sans-condensed-700-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Fira Sans Condensed';font-style:normal;font-weight:700;font-display:swap;
  src:url(fonts/fira-sans-condensed-700-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  --bg:#121110;--text:#f2efe9;--muted:#b3ada3;--line-strong:#3a352f;
  --accent:#f5ae39;--accent-bright:#ffc661;
}
@supports (color:oklch(0.8 0.15 75)){
  :root{--accent:oklch(0.80 0.15 75);--accent-bright:oklch(0.87 0.14 75)}
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Fira Sans',Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;
}
a{color:var(--text);text-decoration:none}
.hazard{height:12px;background:repeating-linear-gradient(135deg,var(--accent) 0 16px,var(--bg) 16px 32px)}
main{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  max-width:640px;margin:0 auto;padding:clamp(40px,10vw,90px) 20px;
}
.code{font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;font-size:clamp(72px,20vw,150px);line-height:.85;color:var(--accent)}
h1{margin:14px 0 12px;font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-weight:700;font-size:clamp(28px,6vw,44px);line-height:1.02;text-transform:uppercase}
p{margin:0 0 28px;color:var(--muted);font-size:17px;line-height:1.5}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:60px;padding:16px 26px;border-radius:10px;font-weight:700;
  transition:background-color .15s ease,border-color .15s ease;
}
.btn--call{background:var(--accent);color:var(--bg);font-family:'Fira Sans Condensed','Fira Sans',sans-serif;font-size:24px}
.btn--call:hover{background:var(--accent-bright)}
.btn--ghost{border:1px solid var(--line-strong);font-weight:600;font-size:16px}
.btn--ghost:hover{border-color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hazard" aria-hidden="true"></div>
<main>
  <p class="code">404</p>
  <h1>Такой страницы нет</h1>
  <p>Ссылка устарела или в адресе опечатка. Если у вас засор — не ищите нужную страницу, просто позвоните: диспетчер на линии круглосуточно.</p>
  <div class="actions">
    <a class="btn btn--call" href="tel:+998337947030"><span aria-hidden="true">☎</span>+998 33 794-70-30</a>
    <a class="btn btn--ghost" href="/">На главную</a>
    <a class="btn btn--ghost" href="/uz/" hreflang="uz" lang="uz">Oʻzbekcha</a>
  </div>
</main>
<div class="hazard" aria-hidden="true"></div>
</body>
</html>
